<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#241B12" />
      <stop offset="100%" stop-color="#090807" />
    </radialGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4B75E" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E87932" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#E87932" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="flameCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E87932" />
      <stop offset="40%" stop-color="#F4B75E" />
      <stop offset="85%" stop-color="#FFFDF7" />
    </linearGradient>
    <linearGradient id="candleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B89A61" />
      <stop offset="40%" stop-color="#F2E8D8" />
      <stop offset="100%" stop-color="#8C7345" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" stroke="#382E24" stroke-width="6"/>

  <!-- Halo glow -->
  <circle cx="256" cy="210" r="160" fill="url(#flameGlow)" />

  <!-- Botanical Marigold Ring subtle accents -->
  <g opacity="0.4" stroke="#E87932" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="190" stroke-dasharray="8 12" />
    <circle cx="256" cy="256" r="215" stroke-dasharray="4 16" />
  </g>

  <!-- Candle Base / Pillar -->
  <path d="M224 260 L224 400 Q224 416 256 416 Q288 416 288 400 L288 260 Q256 266 224 260 Z" fill="url(#candleBody)" />
  <ellipse cx="256" cy="260" rx="32" ry="7" fill="#F2E8D8" opacity="0.9" />

  <!-- Wick -->
  <path d="M256 260 Q257 245 253 234" stroke="#2A241E" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Candle Flame -->
  <path d="M256 128 C280 180 286 215 274 235 C264 250 248 250 238 235 C226 215 232 180 256 128 Z" fill="url(#flameCore)" />
  
  <!-- Inner Flame Heart -->
  <path d="M256 160 C268 190 272 215 264 228 C258 236 248 236 242 228 C234 215 238 190 256 160 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Little sparks / stars of remembrance -->
  <circle cx="160" cy="180" r="3" fill="#F4B75E" opacity="0.7" />
  <circle cx="350" cy="190" r="2.5" fill="#F4B75E" opacity="0.6" />
  <circle cx="190" cy="130" r="2" fill="#E87932" opacity="0.5" />
  <circle cx="320" cy="120" r="2" fill="#E87932" opacity="0.5" />
  <circle cx="256" cy="80" r="3" fill="#FFFDF7" opacity="0.8" />
</svg>
